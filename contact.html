<h2>  <center>Get in touch wih us </center></h2>

<body>
    <div class="simple-contact-container">
  

  <h3>Fill out the form below</h3>
  <h4>and we will get back to you</h4>

  <form class="simple-form">
    <div class="form-field">
      <label for="contact-name">Full Name</label>
      <input type="text" id="contact-name" required placeholder="Your Name">
    </div>
    <div class="form-field">
      <label for="contact-email">Email Address</label>
      <input type="email" id="contact-email" required placeholder="Your Email Address">
    </div>
    <div class="form-field">
      <label for="contact-message">Message</label>
      <textarea id="contact-message" rows="5" required placeholder="How can we help you?"></textarea>
    </div>
    <button type="submit" class="form-submit-btn">Send Message</button>
  </form>
</div>
